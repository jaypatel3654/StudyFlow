name: Validate Apple Watch App

on:
  workflow_dispatch:
  push:
    paths:
      - 'watchOS/**'
      - '.github/workflows/watchos-build.yml'

jobs:
  build-watchos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate full Xcode project
        working-directory: watchOS
        run: xcodegen generate

      - name: Build full Apple Watch app for Simulator
        working-directory: watchOS
        run: |
          set -o pipefail
          xcodebuild \
            -project JKStudyWatch.xcodeproj \
            -scheme JKStudyWatch \
            -configuration Debug \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-full.log

      - name: Generate personal-test Xcode project
        working-directory: watchOS
        run: xcodegen generate --spec project-personal.yml

      - name: Build personal Apple Watch test for Simulator
        working-directory: watchOS
        run: |
          set -o pipefail
          xcodebuild \
            -project JKStudyWatchPersonal.xcodeproj \
            -scheme JKStudyWatchPersonal \
            -configuration Debug \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-personal.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchos-build-logs
          path: |
            watchOS/build-full.log
            watchOS/build-personal.log
          if-no-files-found: ignore
