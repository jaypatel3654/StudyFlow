name: JKStudyWatch
options:
  bundleIdPrefix: com.jkstudymanagement
settings:
  base:
    SWIFT_VERSION: 5.0
    WATCHOS_DEPLOYMENT_TARGET: 10.0

targets:
  JKStudyWatch:
    type: application
    platform: watchOS
    sources:
      - path: .
        excludes:
          - Widgets/**
          - README.md
          - project.yml
          - JKStudyWatch.entitlements
    dependencies:
      - target: JKStudyWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jkstudymanagement.watch
        PRODUCT_NAME: J.K Study
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: J.K Study
        INFOPLIST_KEY_WKApplication: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: JKStudyWatch.entitlements

  JKStudyWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Widgets
        excludes:
          - WidgetExtensionInfo.plist
          - JKStudyWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jkstudymanagement.watch.widgets
        PRODUCT_NAME: J.K Study Widgets
        INFOPLIST_FILE: Widgets/WidgetExtensionInfo.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Widgets/JKStudyWidgets.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
